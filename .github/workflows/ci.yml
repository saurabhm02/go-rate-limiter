name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./test/unit/...

      - name: Build
        run: go build -o /tmp/server ./cmd/server && go build -o /tmp/migrate ./cmd/migrate

  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Concurrency tests (race detector)
        run: go test -race -count=1 ./test/concurrency/...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Integration tests (testcontainers)
        run: go test -tags=integration -count=1 -timeout=15m ./test/integration/...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t rate-limiter:ci .
