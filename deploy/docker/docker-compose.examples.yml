services:
  payment-service:
    build:
      context: ../..
      dockerfile: examples/Dockerfile
      args:
        SERVICE: payment-service
    ports:
      - "8081:8081"
    environment:
      HTTP_PORT: "8081"
      RATE_LIMITER_URL: http://ratelimit:8080
      API_KEY: rl_demo_abc123xyz
    depends_on:
      ratelimit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  order-service:
    build:
      context: ../..
      dockerfile: examples/Dockerfile
      args:
        SERVICE: order-service
    ports:
      - "8082:8082"
    environment:
      HTTP_PORT: "8082"
      RATE_LIMITER_URL: http://ratelimit:8080
      API_KEY: rl_demo_abc123xyz
    depends_on:
      ratelimit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway-middleware:
    build:
      context: ../..
      dockerfile: examples/Dockerfile
      args:
        SERVICE: gateway-middleware
    ports:
      - "8083:8083"
    environment:
      HTTP_PORT: "8083"
      RATE_LIMITER_URL: http://ratelimit:8080
      API_KEY: rl_demo_abc123xyz
      UPSTREAM_URL: http://payment-service:8081
    depends_on:
      ratelimit:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
