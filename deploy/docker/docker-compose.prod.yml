# Production overlay — use with base compose:
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.prod.yml up -d

services:
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://ratelimit:ratelimit@postgres:5432/ratelimit?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ratelimit:
    environment:
      LOG_LEVEL: warn
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres:
    ports: []
    restart: unless-stopped

  redis:
    ports: []
    restart: unless-stopped

  prometheus:
    profiles:
      - observability
